<div class="modal">
  <div class="modal-content">

    <h2>Nueva publicación</h2>

    <form #form="ngForm" (ngSubmit)="onGuardar(form)">

      <div class="campo">
        <label>Nombre del coleccionable:</label>

        <input
          type="text"
          name="nombre"
          [(ngModel)]="publicacion.nombre"
          required
          placeholder="Ej. Charizard EX"
        >
      </div>

      <div class="campo">
        <label>Tipo de publicación:</label>

        <select
          name="tipo"
          [(ngModel)]="publicacion.tipo"
          required
        >
          <option value="Venta">Venta</option>
          <option value="Intercambio">Intercambio</option>
          <option value="Ambos">Ambos</option>
        </select>
      </div>

      @if (publicacion.tipo === 'Venta' || publicacion.tipo === 'Ambos') {
        <div class="campo">
          <label>Precio (S/):</label>

          <input
            type="number"
            name="precio"
            [(ngModel)]="publicacion.precio"
            min="0"
            required
            placeholder="Ingresa el precio"
          >
        </div>
      }

      <div class="campo">
        <label>Descripción:</label>

        <textarea
          name="descripcion"
          [(ngModel)]="publicacion.descripcion"
          required
          placeholder="Describe tu publicación..."
        ></textarea>
      </div>

      <div class="botones">
        <button
          type="button"
          class="btn-cancelar"
          (click)="cerrar.emit()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-guardar"
        >
          Publicar
        </button>
      </div>

    </form>

  </div>
</div>
