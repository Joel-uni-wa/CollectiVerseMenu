
<div class="modal">
  <div class="modal-content">

    <h2>Editar coleccionable</h2>

    <form #miForm="ngForm" (ngSubmit)="onGuardar(miForm)">

      <label>Nombre:</label>
      <input
        type="text"
        [(ngModel)]="producto.nombre"
        name="nombre"
        required
      >

      <label>Precio (S/):</label>
      <input
        type="number"
        [(ngModel)]="producto.precio"
        name="precio"
        required
      >

      <div class="campo">
  
  <label>Categoría:</label>
    <select name="categoria" [(ngModel)]="producto.categoria" required>
      <option value="Pokémon">Pokémon</option>
      <option value="Yu-Gi-Oh!">Yu-Gi-Oh!</option>
      <option value="Uma Musume">Uma Musume</option>
      <option value="Otros">Otros</option>
    </select>
  </div>

  @if (producto.categoria === 'Otros') {
    <div class="campo">
      <label>Especificar categoría:</label>

      <input
        type="text"
        name="categoriaPersonalizada"
        [(ngModel)]="producto.categoriaPersonalizada"
        placeholder="Escribe la categoría..."
        required
      >
    </div>
  }

      <label>Descripción:</label>
      <textarea
        [(ngModel)]="producto.descripcion"
        name="descripcion"
        rows="3"
        required
      ></textarea>

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">
          Cancelar
        </button>

        <button type="submit">
          Guardar cambios
        </button>
      </div>

    </form>

  </div>
</div>
