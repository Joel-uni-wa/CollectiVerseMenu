
<div class="modal">
  <div class="modal-content">

    <h2>Editar coleccionable</h2>

    <form #miForm="ngForm" (ngSubmit)="onGuardar(miForm)">

      <label>Nombre:</label>
      <input
        type="text"
        [(ngModel)]="producto.nombre"
        name="nombre"
        required
      >

      <label>Precio (S/):</label>
      <input
        type="number"
        [(ngModel)]="producto.precio"
        name="precio"
        required
      >

      <label>Categoría:</label>
      <select [(ngModel)]="producto.categoria" name="categoria" required>
        <option value="Pokémon">Pokémon</option>
        <option value="Yu-Gi-Oh!">Yu-Gi-Oh!</option>
        <option value="Otros">Otros</option>
      </select>

      <label>Descripción:</label>
      <textarea
        [(ngModel)]="producto.descripcion"
        name="descripcion"
        rows="3"
        required
      ></textarea>

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">
          Cancelar
        </button>

        <button type="submit">
          Guardar cambios
        </button>
      </div>

    </form>

  </div>
</div>
