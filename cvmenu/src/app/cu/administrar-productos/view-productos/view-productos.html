<div class="contenedor">

  <h2>Mis coleccionables</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      @for (producto of productos; track producto.id) {
        <tr>
          <td>{{ producto.id }}</td>
          <td>{{ producto.nombre }}</td>
          <td>S/ {{ producto.precio }}</td>
          <td>{{ producto.categoria }}</td>
          <td>
            <button (click)="editarProducto(producto)">
              Editar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">No hay coleccionables disponibles.</td>
        </tr>
      }
    </tbody>
  </table>

</div>

@if (mostrarModal) {
  <app-modal-productos
    [producto]="productoSeleccionado"
    (cerrar)="cerrarModal()"
    (guardar)="guardarProducto($event)">
  </app-modal-productos>
}
