<div class="modal">
  <div class="modal-content">

    <h2>Editar servicio</h2>

    <form #miForm="ngForm" (ngSubmit)="onGuardar(miForm)">

      <label>Nombre del servicio:</label>
      <input
        type="text"
        [(ngModel)]="service()!.nombre"
        name="nombre"
      >

      <label>Descripción:</label>
      <textarea
        [(ngModel)]="service()!.descripcion"
        name="descripcion"
        rows="3"
        placeholder="Describe el servicio..."
      ></textarea>

      <label>Precio:</label>
      <input
        type="number"
        [(ngModel)]="service()!.precio"
        name="precio"
      >

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">
          Cancelar
        </button>

        <button type="submit">
          Guardar
        </button>
      </div>

    </form>

  </div>
</div>
