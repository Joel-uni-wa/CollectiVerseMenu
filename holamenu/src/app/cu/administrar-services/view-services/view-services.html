<h2>Lista de servicios</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Servicio</th>
      <th>Precio</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    @for (service of services; track service.id) {
      <tr>
        <td>{{ service.id }}</td>
        <td>{{ service.nombre }}</td>
        <td>{{ service.precio }}</td>
        <td>
          <button (click)="editarService(service)">
            Editar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No hay servicios disponibles</td>
      </tr>
    }
  </tbody>
</table>

@if (mostrarModal) {
  <app-modal-services
    [service]="serviceSeleccionado"
    (cerrar)="cerrarModal()">
  </app-modal-services>
}
